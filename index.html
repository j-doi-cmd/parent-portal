<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>保護者専用ページ</title>

<!-- CSS読み込み -->
<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- ===== ログイン画面 ===== -->

<div id="login-area">

    <div class="login-box">

        <h1>保護者専用</h1>

        <input
            type="password"
            id="password"
            placeholder="パスワードを入力">

        <button onclick="checkPassword()">
            ログイン
        </button>

        <div
            class="error"
            id="error-message">
        </div>

    </div>

</div>

<!-- ===== メイン画面 ===== -->

<div id="main-content">

<header>

    <h1>保護者専用ページ</h1>

    <p>
        各学年のスケジュール・学校イベント
    </p>

</header>

<main class="container">

    <div class="button-area">

        <!-- 1年 -->

        <a
            class="link-button"
            href="1年生URL">

            1年生スケジュール

        </a>

        <!-- 2年 -->

        <a
            class="link-button"
            href="2年生URL">

            2年生スケジュール

        </a>

        <!-- 3年 -->

        <a
            class="link-button"
            href="3年生URL">

            3年生スケジュール

        </a>

        <!-- 学校イベント -->

        <a
            class="link-button"
            href="イベントURL">

            学校イベント

        </a>

    </div>

</main>

<footer>

    © 保護者専用ページ

</footer>

</div>

<!-- password.js読み込み -->
<script src="password.js"></script>

<!-- ログイン判定 -->

<script>

function checkPassword(){

    const inputPassword =
        document.getElementById("password").value;

    if(inputPassword === correctPassword){

        document.getElementById("login-area")
            .style.display = "none";

        document.getElementById("main-content")
            .style.display = "block";

    }else{

        document.getElementById("error-message")
            .innerText = "パスワードが違います";

    }
}

</script>

</body>
</html>
